# Render Multi-Service Blueprint Specification
services:
  # 1. Customer Site Frontend (Free Static Site)
  - type: web
    name: saha-customer-site
    env: static
    rootDir: customer_site/client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://saha-backend-api.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  # 2. Admin Site Frontend (Free Static Site)
  - type: web
    name: saha-admin-site
    env: static
    rootDir: admin_site
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://saha-backend-api.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  # 3. Backend Express API & Email Service (Free Web Service)
  - type: web
    name: saha-backend-api
    env: node
    plan: free
    rootDir: customer_site/server
    buildCommand: npm install
    startCommand: node index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: NOTIFICATION_EMAIL
        value: myakalanagarjun09@gmail.com
      - key: EMAIL_HOST
        value: smtp.gmail.com
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_USER
        value: myakalanagarjun09@gmail.com
      - key: EMAIL_PASS
        sync: false
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
